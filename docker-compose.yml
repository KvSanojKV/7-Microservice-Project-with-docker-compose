services:

  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/bootstrap.sql:/docker-entrypoint-initdb.d/bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net


  # =========================
  # Auth Service
  # =========================
  auth-service:
    build:
      context: ./services/auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      AUTH_DB_URL: "jdbc:postgresql://postgres:5432/auth_db"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net


  # =========================
  # Catalog Service
  # =========================
  catalog-service:
    build:
      context: ./services/catalog-service
    container_name: catalog-service
    ports:
      - "8082:8082"
    environment:
      CATALOG_DB_DSN: "postgres://microapp:microapp123@postgres:5432/catalog_db?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net


  # =========================
  # Inventory Service
  # =========================
  inventory-service:
    build:
      context: ./services/inventory-service
    container_name: inventory-service
    ports:
      - "8083:8083"
    environment:
      INVENTORY_DB_URL: "postgres://microapp:microapp123@postgres:5432/inventory_db"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net


  # =========================
  # Order Service
  # =========================
  order-service:
    build:
      context: ./services/order-service
    container_name: order-service
    ports:
      - "8084:8084"
    environment:
      ORDER_DB_DSN: "dbname=order_db user=microapp password=microapp123 host=postgres port=5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net


  # =========================
  # Payment Service
  # =========================
  payment-service:
    build:
      context: ./services/payment-service
    container_name: payment-service
    ports:
      - "8085:8085"
    environment:
      PAYMENT_DB_URL: "Host=postgres;Port=5432;Database=payment_db;Username=microapp;Password=microapp123"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net


  # =========================
  # Notification Service
  # =========================
  notification-service:
    build:
      context: ./services/notification-service
    container_name: notification-service
    ports:
      - "8086:8086"
    environment:
      NOTIFICATION_DB_URL: "postgres://microapp:microapp123@postgres:5432/notification_db"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net


  # =========================
  # Analytics Service
  # =========================
  analytics-service:
    build:
      context: ./services/analytics-service
    container_name: analytics-service
    ports:
      - "8087:8087"
    environment:
      ANALYTICS_DB_DSN: "pgsql:host=postgres;port=5432;dbname=analytics_db"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net


  # =========================
  # Frontend
  # =========================
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - catalog-service
      - inventory-service
      - order-service
      - payment-service
      - notification-service
      - analytics-service
    networks:
      - microservices-net


# =========================
# Network
# =========================
networks:
  microservices-net:
    driver: bridge


# =========================
# Volumes
# =========================
volumes:
  postgres_data:
